services:
  spark-connect:
    image: apache/spark:4.1.1-scala2.13-java17-python3-ubuntu
    ports:
      - 15002:15002
    user: root
    command: ["/opt/spark/sbin/start-connect-server.sh", "--wait", "--master", "local[*]"]
    volumes:
      - spark-data:/opt/spark/work-dir
      - spark-jars:/opt/spark/jars
      - ../../data:/opt/spark/work-dir/data
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
volumes:
  spark-data:
    driver: local
  spark-jars:
    driver: local