name: unitycatalog

services:
  server:
    image: docker.io/unitycatalog/unitycatalog:main
    ports:
      - "8080:8080"
    command: >
      sh -c "./bin/start-uc-server &
             sleep 7 &&
             ./bin/uc catalog create --name imc_prosperity &&
             ./bin/uc schema create --catalog imc_prosperity --name bronze &&
             ./bin/uc schema create --catalog imc_prosperity --name silver &&
             ./bin/uc schema create --catalog imc_prosperity --name gold
             wait"
    volumes:
      - type: bind
        source: ./etc/conf/server.properties
        target: /opt/unitycatalog/etc/conf/server.properties
      - type: bind
        source: ./etc/conf/server.properties
        target: /home/unitycatalog/etc/conf/server.properties
#      - type: volume
#        source: unitycatalog_data
#        target: /home/unitycatalog/etc/data
  ui:
    image: docker.io/unitycatalog/unitycatalog-ui:main
    ports:
      - "3000:3000"
    depends_on:
      - server

